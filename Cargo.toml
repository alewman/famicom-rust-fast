[package]
name = "famicom-rust-fast"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A speed fork of famicom-rust, held in lockstep with it"
license = "MIT"
repository = "https://github.com/alewman/famicom-rust-fast"
publish = false

[lib]
name = "famicom_rust"

[dependencies]
# 6502-rust (crate sixfiveohtwo), transcribed from 6502-python 741419a; its
# NMOS core is identical to 6502-python 9dc34bd, which famicom-python pins at
# famicom-rust-pin-1 (the two differ only in tooling).
sixfiveohtwo = { git = "https://github.com/alewman/6502-rust", rev = "71747eb9036702109fb206eb9fe88174a9dcc989" }
# The VRC7's sound chip (mapper 85): the restarted ym2413-rust (2026-11-13), proven
# equivalent to the restarted ym2413-python.
ym2413-rust = { package = "ym2413-rust", git = "https://github.com/alewman/ym2413-rust", rev = "94df223e3e5b32d4042f321a834f6214a5ef9692", features = ["serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
crc32fast = "1"
sha1 = "0.10"
serde_json = "1"
flate2 = "1"
# Save states (src/state.rs).
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
bincode = "1.3"
# The sampling profiler (famicom-profile) only.
libc = { version = "0.2", optional = true }

[features]
profile = ["dep:libc"]

[[bin]]
name = "famicom-profile"
required-features = ["profile"]

[profile.release]
debug = 1
